name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two publishes racing could leave `8.5` and `latest` on the older build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  # One native runner per platform. Under QEMU the arm64 half compiles intl
  # from source for the better part of the build; natively it takes a minute.
  # Each tests its image before pushing it by digest only, and `image` below
  # tags the pair.
  image-platform:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Name the image and platform
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: laravel-php:test
          # Scoped per platform, or the two runners overwrite each other's cache.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Test
        run: tests/run.sh laravel-php:test

      # Named by the PHP version inside the image, so `image` can check both
      # platforms agree and tag with it.
      - name: Export the PHP version
        run: |
          mkdir -p "$RUNNER_TEMP/version"
          version=$(docker run --rm --entrypoint php laravel-php:test -r 'echo PHP_VERSION;')
          touch "$RUNNER_TEMP/version/$version"

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again, served from the cache the first one just filled.
      - id: push
        name: Push by digest
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.push.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: version-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/version/*
          if-no-files-found: error
          retention-days: 1

  # Combines the two platform images into one multi-platform image and gives it
  # the tags; nothing is built here.
  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image-platform
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/version
          pattern: version-*
          merge-multiple: true

      - name: Read the PHP version
        working-directory: ${{ runner.temp }}/version
        run: |
          versions=(*)
          if [ "${#versions[@]}" -ne 1 ]; then
            echo "The platforms built different PHP versions: ${versions[*]}" >&2
            exit 1
          fi
          echo "PHP_VERSION=${versions[0]}" >> "$GITHUB_ENV"
          echo "PHP_MINOR=${versions[0]%.*}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.PHP_VERSION }}
            type=raw,value=${{ env.PHP_MINOR }}
            type=raw,value=latest

      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Split on purpose: one -t per tag, one argument per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$PHP_VERSION"
